name: Apply currency alignment fix

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply simple currency alignment fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('js/ui.js')
          text = ui.read_text()
          text = text.replace("renderJobCalculatedCost('Extra parts cost', calc.partsCost)", "renderJobCalculatedCost('Extra parts cost', calc.partsCost, true)", 1)
          ui.write_text(text)

          css = Path('css/styles.css')
          text = css.read_text()
          text += '''

/* Job Sheet currency alignment override */
.job-cost-grid .form-group {
  display: flex;
  flex-direction: column;
  margin-bottom: 0.875rem;
}
.job-cost-grid .form-group > label {
  min-height: 1.5rem;
  display: flex;
  align-items: flex-end;
}
.job-cost-grid .currency-input {
  position: static;
  display: flex;
  align-items: center;
  width: 100%;
  height: 42px;
  padding: 0 0.75rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fff;
}
.job-cost-grid .currency-input .currency-prefix {
  position: static;
  transform: none;
  flex: 0 0 auto;
  margin-right: 0.4rem;
  color: var(--text);
  pointer-events: none;
}
.job-cost-grid .currency-input input,
.job-cost-grid .currency-input input[type="number"] {
  flex: 1 1 auto;
  min-width: 0;
  width: 100%;
  height: 40px;
  margin: 0;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}
.job-cost-grid .currency-input input:focus {
  outline: none;
}
'''
          css.write_text(text)

          index = Path('index.html')
          text = index.read_text()
          text = text.replace('styles.css?v=20260817-6', 'styles.css?v=20260817-8')
          text = text.replace('ui.js?v=20260817-6', 'ui.js?v=20260817-8')
          index.write_text(text)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ui.js css/styles.css index.html
          git commit -m "Fix cost box alignment and add extra parts pound sign"
          git push