name: Label job sheet parts fields

on:
  push:
    paths:
      - '.github/workflows/label-job-parts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI and CSS
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('js/ui.js')
          s = p.read_text()
          old = '''      <input type="number" min="0" step="0.01" value="${part.costPerUnit || 0}" placeholder="Cost" onchange="updateJobPart('${escapeJsString(job.id)}','${escapeJsString(part.id)}','costPerUnit',this.value)">
      <input type="number" min="0" step="0.01" value="${part.pricePerUnit || 0}" placeholder="Price" onchange="updateJobPart('${escapeJsString(job.id)}','${escapeJsString(part.id)}','pricePerUnit',this.value)">'''
          new = '''      <label class="job-part-money-field"><span>Cost</span><input type="number" min="0" step="0.01" value="${part.costPerUnit || 0}" placeholder="Cost" onchange="updateJobPart('${escapeJsString(job.id)}','${escapeJsString(part.id)}','costPerUnit',this.value)"></label>
      <label class="job-part-money-field"><span>Price</span><input type="number" min="0" step="0.01" value="${part.pricePerUnit || 0}" placeholder="Price" onchange="updateJobPart('${escapeJsString(job.id)}','${escapeJsString(part.id)}','pricePerUnit',this.value)"></label>'''
          if old not in s:
              raise SystemExit('Expected job parts fields not found')
          p.write_text(s.replace(old, new, 1))

          css_path = Path('css/styles.css')
          css = css_path.read_text()
          addition = '''\n\n/* Visible labels for cost/price fields in Job Sheet parts rows */\n.job-part-money-field {\n  display: flex;\n  flex-direction: column;\n  gap: 0.2rem;\n  font-size: 0.72rem;\n  font-weight: 600;\n  color: #475569;\n}\n.job-part-money-field input { width: 100%; }\n'''
          if '.job-part-money-field {' not in css:
              css_path.write_text(css + addition)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ui.js css/styles.css
          git commit -m "Show Cost and Price labels on job sheet parts"
          git push