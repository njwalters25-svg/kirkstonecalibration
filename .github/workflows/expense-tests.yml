name: Expense module tests

on:
  push:
    branches:
      - feature/mileage-claims
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check js/expense-accounting.js
          node --check js/mileage-claims.js
          node --check js/firebase.js
          node --check js/invoice-spreadsheet.js
      - name: Run accounting tests
        run: node --test tests/*.test.cjs
