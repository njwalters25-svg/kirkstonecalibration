name: Apply parts labels

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-parts-labels.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply labels
        run: |
          echo '' | base64 --decode > /tmp/apply_parts_labels.py
          python3 /tmp/apply_parts_labels.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ui.js css/styles.css
          git commit -m "Show Cost and Price labels on job sheet parts"
          git push