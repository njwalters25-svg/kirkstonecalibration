name: Add pound prefixes to job cost fields

on:
  push:
    paths:
      - '.github/workflows/add-job-cost-currency-prefix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add visible pound prefixes to monetary job cost boxes
        shell: python
        run: |
          from pathlib import Path

          ui = Path('js/ui.js')
          s = ui.read_text()

          replacements = {
            "${renderJobCostInput(job.id, 'hotel', 'Hotel', job.costs?.hotel)}": "${renderJobCostInput(job.id, 'hotel', 'Hotel', job.costs?.hotel, true)}",
            "${renderJobCostInput(job.id, 'food', 'Food', job.costs?.food)}": "${renderJobCostInput(job.id, 'food', 'Food', job.costs?.food, true)}",
            "${renderJobCostInput(job.id, 'fuel', 'Other travel cost', job.costs?.fuel)}": "${renderJobCostInput(job.id, 'fuel', 'Other travel cost', job.costs?.fuel, true)}",
            "${renderJobCostInput(job.id, 'shipping', 'Shipping', job.costs?.shipping)}": "${renderJobCostInput(job.id, 'shipping', 'Shipping', job.costs?.shipping, true)}",
            "${renderJobCostInput(job.id, 'secondPerson', 'Second person', job.costs?.secondPerson)}": "${renderJobCostInput(job.id, 'secondPerson', 'Second person', job.costs?.secondPerson, true)}",
            "${renderJobCostInput(job.id, 'other', 'Other', job.costs?.other)}": "${renderJobCostInput(job.id, 'other', 'Other', job.costs?.other, true)}",
            "${renderJobCalculatedCost(`Mileage allowance @ ${calc.mileageRatePence}p`, calc.mileageCost)}": "${renderJobCalculatedCost(`Mileage allowance @ ${calc.mileageRatePence}p`, calc.mileageCost, true)}",
            "${renderJobFieldInput(job.id, 'stickerCostPerPipette', 'Sticker cost per pipette', job.stickerCostPerPipette ?? calc.stickerCostPerPipette, '0.01')}": "${renderJobFieldInput(job.id, 'stickerCostPerPipette', 'Sticker cost per pipette', job.stickerCostPerPipette ?? calc.stickerCostPerPipette, '0.01', true)}",
            "${renderJobCalculatedCost('Sticker total', calc.stickerCost)}": "${renderJobCalculatedCost('Sticker total', calc.stickerCost, true)}",
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'Expected call not found: {old}')
            s = s.replace(old, new, 1)

          old_cost = '''function renderJobCostInput(jobId, field, label, value) {\n  return `\n    <div class="form-group">\n      <label>${escapeHtml(label)}</label>\n      <input type="number" min="0" step="0.01" value="${value || 0}" onchange="updateJobCost('${escapeJsString(jobId)}','${escapeJsString(field)}',this.value)">\n    </div>`;\n}'''
          new_cost = '''function renderJobCostInput(jobId, field, label, value, currency = false) {\n  return `\n    <div class="form-group">\n      <label>${escapeHtml(label)}</label>\n      <div class="${currency ? 'currency-input' : ''}">\n        ${currency ? '<span class="currency-prefix">£</span>' : ''}\n        <input type="number" min="0" step="0.01" value="${value || 0}" onchange="updateJobCost('${escapeJsString(jobId)}','${escapeJsString(field)}',this.value)">\n      </div>\n    </div>`;\n}'''
          if old_cost not in s:
            raise SystemExit('renderJobCostInput block not found')
          s = s.replace(old_cost, new_cost, 1)

          old_calc = '''function renderJobCalculatedCost(label, value) {\n  return `\n    <div class="form-group">\n      <label>${escapeHtml(label)}</label>\n      <input type="number" value="${value || 0}" readonly>\n    </div>`;\n}'''
          new_calc = '''function renderJobCalculatedCost(label, value, currency = false) {\n  return `\n    <div class="form-group">\n      <label>${escapeHtml(label)}</label>\n      <div class="${currency ? 'currency-input' : ''}">\n        ${currency ? '<span class="currency-prefix">£</span>' : ''}\n        <input type="number" value="${value || 0}" readonly>\n      </div>\n    </div>`;\n}'''
          if old_calc not in s:
            raise SystemExit('renderJobCalculatedCost block not found')
          s = s.replace(old_calc, new_calc, 1)

          old_field = '''function renderJobFieldInput(jobId, field, label, value, step = '1') {\n  return `\n    <div class="form-group">\n      <label>${escapeHtml(label)}</label>\n      <input type="number" min="0" step="${escapeHtml(step)}" value="${value || 0}" onchange="updateJobField('${escapeJsString(jobId)}','${escapeJsString(field)}',this.value)">\n    </div>`;\n}'''
          new_field = '''function renderJobFieldInput(jobId, field, label, value, step = '1', currency = false) {\n  return `\n    <div class="form-group">\n      <label>${escapeHtml(label)}</label>\n      <div class="${currency ? 'currency-input' : ''}">\n        ${currency ? '<span class="currency-prefix">£</span>' : ''}\n        <input type="number" min="0" step="${escapeHtml(step)}" value="${value || 0}" onchange="updateJobField('${escapeJsString(jobId)}','${escapeJsString(field)}',this.value)">\n      </div>\n    </div>`;\n}'''
          if old_field not in s:
            raise SystemExit('renderJobFieldInput block not found')
          s = s.replace(old_field, new_field, 1)
          ui.write_text(s)

          css = Path('css/styles.css')
          c = css.read_text()
          if '.currency-input {' not in c:
            c += '''\n\n/* Currency prefix inside Job Sheet monetary inputs */\n.currency-input {\n  position: relative;\n}\n.currency-input .currency-prefix {\n  position: absolute;\n  left: 0.65rem;\n  top: 50%;\n  transform: translateY(-50%);\n  color: var(--text-light);\n  pointer-events: none;\n  z-index: 1;\n}\n.currency-input input {\n  padding-left: 1.5rem;\n  width: 100%;\n}\n'''
          css.write_text(c)

          index = Path('index.html')
          i = index.read_text()
          i = i.replace('styles.css?v=20260817-5', 'styles.css?v=20260817-6')
          i = i.replace('ui.js?v=20260817-5', 'ui.js?v=20260817-6')
          index.write_text(i)

      - name: Commit real app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ui.js css/styles.css index.html
          git commit -m "Show pound signs in job cost fields"
          git push