name: Repair settings and service levels 20260818

on:
  push:
    paths:
      - '.github/workflows/repair-settings-service-levels-20260818.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch settings save and service level loading
        shell: python
        run: |
          from pathlib import Path

          ui = Path('js/ui.js')
          s = ui.read_text()
          old = '''function collectSettingsFromForm() {
  const num = id => parseFloat(document.getElementById(id).value) || 0;
  const str = id => document.getElementById(id)?.value || '';
  return {
    serviceLevels: collectServiceLevelsFromEditor(),
    partsCatalog: collectPartsCatalogFromEditor(),
    costSingleChannel: num('s_costSingleChannel'),
    costMultiChannel6: num('s_costMultiChannel6'),
    costMultiChannel8: num('s_costMultiChannel8'),
    costMultiChannel12: num('s_costMultiChannel12'),
    costMultiChannel16: num('s_costMultiChannel16'),
    stickerCostPerPipette: num('s_stickerCostPerPipette'),
    labourRatePerHour: num('s_labourRatePerHour'),
    workingHoursPerDay: num('s_workingHoursPerDay') || 8,
    secondPersonDayCost: num('s_secondPersonDayCost'),
    secondPersonTimeReduction: num('s_secondPersonTimeReduction'),
    mileageRatePence: num('s_mileageRatePence'),
    travelChargeToCustomer: document.getElementById('s_travelChargeToCustomer').checked,
    travelChargePerMile: num('s_travelChargePerMile'),
    homePostcode: document.getElementById('s_homePostcode').value.trim() || 'DE75 7UJ',
    londonPremiumPercent: num('s_londonPremiumPercent'),
    hotelBudgetDefault: num('s_hotelBudgetDefault'),
    overnightThresholdMins: num('s_overnightThresholdMins') || 90,
    chargeAccommodationToCustomer: document.getElementById('s_chargeAccommodationToCustomer').checked,
    subsistenceOvernightRate: num('s_subsistenceOvernightRate'),
    subsistenceDayTripRate: num('s_subsistenceDayTripRate'),
    discountRegularPercent: num('s_discountRegularPercent'),
    discountContractPercent: num('s_discountContractPercent'),
    companyName: str('s_companyName').trim() || 'Kirkstone Calibration',
    companyAddress: str('s_companyAddress'),
    companyPhone: str('s_companyPhone').trim(),
    companyEmail: str('s_companyEmail').trim(),
    companyWebsite: str('s_companyWebsite').trim(),
    vatNumber: str('s_vatNumber').trim(),
    quoteValidDays: parseInt(str('s_quoteValidDays')) || 30,
  };
}'''
          new = '''function collectSettingsFromForm() {
  const base = currentSettings || DEFAULT_SETTINGS;
  const num = (id, fallback = 0) => {
    const el = document.getElementById(id);
    if (!el) return fallback;
    const parsed = parseFloat(el.value);
    return Number.isFinite(parsed) ? parsed : fallback;
  };
  const str = (id, fallback = '') => {
    const el = document.getElementById(id);
    return el ? el.value : fallback;
  };
  const checked = (id, fallback = false) => {
    const el = document.getElementById(id);
    return el ? el.checked : fallback;
  };
  return {
    ...base,
    serviceLevels: collectServiceLevelsFromEditor(),
    partsCatalog: collectPartsCatalogFromEditor(),
    costSingleChannel: num('s_costSingleChannel', base.costSingleChannel),
    costMultiChannel6: num('s_costMultiChannel6', base.costMultiChannel6),
    costMultiChannel8: num('s_costMultiChannel8', base.costMultiChannel8),
    costMultiChannel12: num('s_costMultiChannel12', base.costMultiChannel12),
    costMultiChannel16: num('s_costMultiChannel16', base.costMultiChannel16),
    stickerCostPerPipette: num('s_stickerCostPerPipette', base.stickerCostPerPipette),
    labourRatePerHour: num('s_labourRatePerHour', base.labourRatePerHour),
    workingHoursPerDay: num('s_workingHoursPerDay', base.workingHoursPerDay || 8),
    secondPersonDayCost: num('s_secondPersonDayCost', base.secondPersonDayCost),
    secondPersonTimeReduction: num('s_secondPersonTimeReduction', base.secondPersonTimeReduction),
    mileageRatePence: num('s_mileageRatePence', base.mileageRatePence),
    travelChargeToCustomer: checked('s_travelChargeToCustomer', base.travelChargeToCustomer),
    travelChargePerMile: num('s_travelChargePerMile', base.travelChargePerMile),
    homePostcode: str('s_homePostcode', base.homePostcode || 'DE75 7UJ').trim() || 'DE75 7UJ',
    londonPremiumPercent: num('s_londonPremiumPercent', base.londonPremiumPercent),
    hotelBudgetDefault: num('s_hotelBudgetDefault', base.hotelBudgetDefault),
    overnightThresholdMins: num('s_overnightThresholdMins', base.overnightThresholdMins || 90),
    chargeAccommodationToCustomer: checked('s_chargeAccommodationToCustomer', base.chargeAccommodationToCustomer),
    subsistenceOvernightRate: num('s_subsistenceOvernightRate', base.subsistenceOvernightRate),
    subsistenceDayTripRate: num('s_subsistenceDayTripRate', base.subsistenceDayTripRate),
    discountRegularPercent: num('s_discountRegularPercent', base.discountRegularPercent),
    discountContractPercent: num('s_discountContractPercent', base.discountContractPercent),
    companyName: str('s_companyName', base.companyName || 'Kirkstone Calibration').trim() || 'Kirkstone Calibration',
    companyAddress: str('s_companyAddress', base.companyAddress || ''),
    companyPhone: str('s_companyPhone', base.companyPhone || '').trim(),
    companyEmail: str('s_companyEmail', base.companyEmail || '').trim(),
    companyWebsite: str('s_companyWebsite', base.companyWebsite || '').trim(),
    vatNumber: str('s_vatNumber', base.vatNumber || '').trim(),
    quoteValidDays: parseInt(str('s_quoteValidDays', base.quoteValidDays || 30)) || 30,
  };
}'''
          if old not in s:
            raise SystemExit('collectSettingsFromForm block not found')
          ui.write_text(s.replace(old, new, 1))

          app = Path('js/app.js')
          a = app.read_text()
          marker = '''async function backfillMissingQuoteSettingsSnapshots(rawQuotes, quotesWithSnapshots) {'''
          helper = '''function recoverHistoricalServiceLevels(settings, quotes) {
  const current = Array.isArray(settings?.serviceLevels) ? settings.serviceLevels : [];
  const merged = [];
  const seen = new Set();
  const add = level => {
    if (!level || !level.name) return;
    const key = String(level.id || level.name).toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    merged.push(cloneSettings(level));
  };
  current.forEach(add);
  (quotes || []).forEach(quote => {
    const levels = quote?.settingsSnapshot?.serviceLevels;
    if (Array.isArray(levels)) levels.forEach(add);
  });
  return merged;
}

async function repairMissingServiceLevelsFromHistory() {
  const current = Array.isArray(currentSettings?.serviceLevels) ? currentSettings.serviceLevels : [];
  const recovered = recoverHistoricalServiceLevels(currentSettings, currentQuotes);
  if (current.length <= 2 && recovered.length > current.length) {
    currentSettings = { ...currentSettings, serviceLevels: recovered };
    StorageManager.saveSettings(currentSettings);
    if (!isLocalPreviewMode) {
      try {
        await saveSettingsToFirestore(currentSettings);
      } catch (error) {
        console.error('Recovered service levels locally but could not save them to Firebase', error);
      }
    }
    populateSettingsForm(currentSettings);
    wireServiceLevelRemoveButtons();
    wirePartsCatalogRemoveButtons();
    return true;
  }
  return false;
}

'''
          if helper not in a:
            if marker not in a:
              raise SystemExit('app helper insertion marker not found')
            a = a.replace(marker, helper + marker, 1)

          old_cloud = '''    populateSettingsForm(currentSettings);
    wireServiceLevelRemoveButtons();
    wirePartsCatalogRemoveButtons();
  }

  await refreshQuoteHistory();
  await refreshJobSheets();'''
          new_cloud = '''    populateSettingsForm(currentSettings);
    wireServiceLevelRemoveButtons();
    wirePartsCatalogRemoveButtons();

    const currentLines = collectPipetteLinesFromForm();
    renderPipetteLines(currentLines, currentSettings);
    wirePipetteLineEvents();
  }

  await refreshQuoteHistory();
  const repairedServiceLevels = await repairMissingServiceLevelsFromHistory();
  if (repairedServiceLevels) {
    const currentLines = collectPipetteLinesFromForm();
    renderPipetteLines(currentLines, currentSettings);
    wirePipetteLineEvents();
  }
  await refreshJobSheets();'''
          if old_cloud not in a:
            raise SystemExit('Firebase settings block not found')
          a = a.replace(old_cloud, new_cloud, 1)
          app.write_text(a)

          index = Path('index.html')
          i = index.read_text()
          i = i.replace('js/ui.js?v=20260817-9', 'js/ui.js?v=20260818-2')
          i = i.replace('js/app.js?v=20260818-1', 'js/app.js?v=20260818-2')
          index.write_text(i)

      - name: Commit real app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ui.js js/app.js index.html
          git commit -m "Repair settings save and restore service levels"
          git push

# trigger 2
